# dotRPG test API (Node on 127.0.0.1:3000). certbot adds the HTTPS server block.
# 부하 방지(Docs/server/phase15_load_and_logging.md L5): IP당 초당 30요청(버스트 60), 동시 연결 50, 본문 수신 10초.
# 웹소켓(/ws, /relay)은 오래 열려 있으므로 응답 대기 시간을 따로 길게 둔다.
map $http_upgrade $dotrpg_connection_upgrade { default upgrade; "" close; }
limit_req_zone $binary_remote_addr zone=dotrpg_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=dotrpg_conn:10m;
server {
    server_name 35-216-2-121.sslip.io;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 10s;
    limit_conn dotrpg_conn 50;
    limit_conn_status 429;
    limit_req_status 429;

    location ~ ^/(ws|relay)$ {
        limit_req zone=dotrpg_req burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dotrpg_connection_upgrade;
        proxy_read_timeout 120s;
    }
    location / {
        limit_req zone=dotrpg_req burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/35-216-2-121.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/35-216-2-121.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = 35-216-2-121.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name 35-216-2-121.sslip.io;
    listen 80;
    return 404; # managed by Certbot


}
