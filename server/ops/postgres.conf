# PostgreSQL 시작값(RAM 4GB 가정, 가정이므로 부하 시험 뒤 조정한다: phase7_ops.md 3.2, 9.2의 15번)
listen_addresses = '*'
shared_buffers = 1GB
effective_cache_size = 2GB
max_connections = 50            # 앱 풀 10 + LISTEN 1 + 마이그레이션·백업·운영자 여유
work_mem = 8MB
wal_compression = on
checkpoint_timeout = 15min
max_wal_size = 2GB
log_min_duration_statement = 500
log_lock_waits = on
idle_in_transaction_session_timeout = 30s

